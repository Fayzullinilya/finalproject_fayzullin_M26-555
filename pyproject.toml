[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Итоговый проект"
readme = "README.md"
authors = [
    { name = "Ilya Fayzullin", email = "ilyafayzullin@yandex.com" }
]
requires-python = ">=3.13"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
project = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
